name: First-task compatibility report
description: Report a small, reproducible result without sharing your desktop.
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying the kit. Do not include tokens, credentials,
        private code, desktop screenshots, raw journals or complete configurations.
        A permission denial is a valid result, not a reason to bypass approval.
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Kit release, Copilot CLI, distribution, Plasma version and session type.
      placeholder: "v0.1.0; Copilot 1.0.112; distro/version; Plasma/version; Wayland"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Furthest stage reached
      options:
        - Plugin discovery
        - Backend installation
        - Portal approval
        - Calculator action
        - Visible result verification
        - Backend removal
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Result at that stage
      options:
        - Passed
        - Failed
        - Stopped after permission refusal
        - Not sure
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Expected and observed result
      description: Use the harmless example only. Include a sanitized error code if relevant.
      placeholder: "KCalc showed 437; removal completed. No screenshots attached."
    validations:
      required: true
  - type: textarea
    id: display
    attributes:
      label: Relevant display or keyboard details
      description: Optional scale, monitor count or layout; omit personal information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private text and machine identifiers.
          required: true
