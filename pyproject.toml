[project]
name = "copilot-kubuntu-desktop-kit"
version = "0.1.0"
description = "Portable Copilot workflows for Kubuntu and KDE Wayland"
requires-python = ">=3.12"

[dependency-groups]
dev = ["PyYAML==6.0.3", "ruff==0.17.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
