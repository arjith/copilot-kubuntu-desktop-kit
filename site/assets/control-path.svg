<svg xmlns="http://www.w3.org/2000/svg" width="520" height="430" viewBox="0 0 520 430" fill="none">
  <title>A local control path with a human permission handoff</title>
  <desc>On selection, Copilot CLI's desktop-operator agent starts the pinned computer-use-linux backend through local stdio MCP. The user approves the KDE portal. The backend observes, acts on, and verifies the requested app. Denied permission means stop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="m1 1 4 3-4 3" stroke="#b5e0e9" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <path d="M18 34v350" stroke="#54727b" stroke-dasharray="2 6"/>
    <rect x="5" y="38" width="27" height="24" fill="#15313a"/>
    <text x="7" y="54" fill="#b3c9cc" font-size="12" font-family="ui-monospace, monospace">01</text>
    <rect x="47" y="20" width="452" height="84" rx="2" fill="#1c3b45" stroke="#6f939b"/>
    <path d="M65 39h22v16H65zM65 44h22m-16 5 3 2-3 2m8 0h4" stroke="#b5e0e9" stroke-width="1.4"/>
    <text x="101" y="52" fill="#f0f5ef" font-size="21" font-weight="600">Copilot CLI</text>
    <text x="65" y="80" fill="#b3c9cc" font-size="14">desktop-operator agent</text>
    <path d="M273 104v43" stroke="#b5e0e9" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="290" y="133" fill="#b5e0e9" font-size="12" font-family="ui-monospace, monospace">local stdio · MCP</text>

    <rect x="5" y="176" width="27" height="24" fill="#15313a"/>
    <text x="7" y="192" fill="#b3c9cc" font-size="12" font-family="ui-monospace, monospace">02</text>
    <rect x="47" y="152" width="452" height="84" rx="2" fill="#1c3b45" stroke="#6f939b"/>
    <text x="65" y="185" fill="#f0f5ef" font-size="21" font-weight="600">computer-use-linux</text>
    <text x="65" y="212" fill="#b3c9cc" font-size="14">v0.7.53 · pinned upstream backend</text>
    <path d="M273 236v28m0 42v32" stroke="#b5e0e9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <path d="M47 285h63m326 0h63" stroke="#f0ca86" stroke-dasharray="3 4"/>
    <rect x="116" y="264" width="314" height="42" rx="2" fill="#15313a" stroke="#f0ca86"/>
    <circle cx="138" cy="279" r="4" stroke="#f0ca86" stroke-width="1.5"/>
    <path d="M131 294v-2a7 7 0 0 1 14 0v2" stroke="#f0ca86" stroke-width="1.5"/>
    <text x="157" y="290" fill="#f0ca86" font-size="15" font-weight="550">You approve the KDE portal</text>
    <text x="48" y="323" fill="#f0ca86" font-size="11" font-family="ui-monospace, monospace">denied → stop</text>

    <rect x="5" y="372" width="27" height="24" fill="#15313a"/>
    <text x="7" y="388" fill="#b3c9cc" font-size="12" font-family="ui-monospace, monospace">03</text>
    <rect x="47" y="344" width="452" height="74" rx="2" fill="#1c3b45" stroke="#6f939b"/>
    <text x="65" y="375" fill="#f0f5ef" font-size="21" font-weight="600">The requested KDE app</text>
    <text x="65" y="401" fill="#b5e0e9" font-size="14">observe → act → verify</text>
  </g>
</svg>
