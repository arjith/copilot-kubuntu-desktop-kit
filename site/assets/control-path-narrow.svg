<svg xmlns="http://www.w3.org/2000/svg" width="300" height="430" viewBox="0 0 300 430" fill="none">
  <title>The local control path, compact view</title>
  <desc>The desktop-operator agent starts computer-use-linux over local stdio MCP. The user approves the KDE portal before the backend operates the requested app. Denied permission means stop.</desc>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="8" y="10" width="284" height="76" rx="2" fill="#1c3b45" stroke="#6f939b"/>
    <text x="24" y="40" fill="#f0f5ef" font-size="21" font-weight="600">Copilot CLI</text>
    <text x="24" y="65" fill="#b3c9cc" font-size="15">desktop-operator agent</text>
    <path d="M48 86v47m-5-6 5 6 5-6" stroke="#b5e0e9" stroke-width="1.5"/>
    <text x="65" y="116" fill="#b5e0e9" font-size="14">local stdio · MCP</text>

    <rect x="8" y="140" width="284" height="82" rx="2" fill="#1c3b45" stroke="#6f939b"/>
    <text x="24" y="171" fill="#f0f5ef" font-size="21" font-weight="600">computer-use-linux</text>
    <text x="24" y="198" fill="#b3c9cc" font-size="15">v0.7.53 · pinned backend</text>
    <path d="M150 222v28m0 56v39m-5-6 5 6 5-6" stroke="#b5e0e9" stroke-width="1.5"/>

    <path d="M8 278h19m246 0h19" stroke="#f0ca86" stroke-dasharray="3 4"/>
    <rect x="33" y="250" width="234" height="56" rx="2" fill="#15313a" stroke="#f0ca86"/>
    <text x="150" y="274" text-anchor="middle" fill="#f0ca86" font-size="17" font-weight="550">You approve</text>
    <text x="150" y="295" text-anchor="middle" fill="#f0ca86" font-size="15">the KDE portal</text>
    <text x="8" y="333" fill="#f0ca86" font-size="13">denied → stop</text>

    <rect x="8" y="352" width="284" height="70" rx="2" fill="#1c3b45" stroke="#6f939b"/>
    <text x="24" y="381" fill="#f0f5ef" font-size="21" font-weight="600">Requested KDE app</text>
    <text x="24" y="407" fill="#b5e0e9" font-size="15">observe → act → verify</text>
  </g>
</svg>
